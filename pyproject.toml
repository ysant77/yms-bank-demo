[project]
name = "ledger-demo"
version = "0.1.0"
description = "Synthetic demo bank service for verifier scenarios"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# The synthetic fraud score kit (src/fraud). The bank service does not need it.
fraud = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit==2.9.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank", "src/fraud"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "bank/migrations"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The fraud tests skip at import time when the fraud extra is not installed.
"tests/test_fraud_*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "bank.testing.ci_report", "--strict-markers", "-m", "not bench"]
markers = ["bench: throughput benchmarks, excluded by default; run with -m bench"]
# A test that hangs prints every thread's stack, so a CI timeout shows where it stopped.
faulthandler_timeout = 120
# The test client still uses httpx; silence its upstream deprecation notice.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
