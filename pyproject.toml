[project]
name = "ledger-demo"
version = "0.1.0"
description = "Synthetic demo bank service for verifier scenarios"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "bank/migrations"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "bank.testing.ci_report", "--strict-markers", "-m", "not bench"]
markers = ["bench: throughput benchmarks, excluded by default; run with -m bench"]
# The test client still uses httpx; silence its upstream deprecation notice.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
