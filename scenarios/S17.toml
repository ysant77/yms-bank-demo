id = "S17"
title = "Failed evaluation gate"
seed = "k7_weak_model"
base_branch = "test/s17-seed-weak-model"
twin_branch = "feat/{key_lower}-fraud-model-v3"
pr_title = "{KEY}: ship fraud model v3"
twin = "Omar"
author = "scripted"

[ticket]
type = "Story"
points = 3
summary = "Ship fraud model v3"
acceptance_criteria = """
AC1 | Holdout PR-AUC on days 61-90 is at least 0.25 | metric_at_least(pr_auc, 0.25)
AC2 | Holdout false positive rate at the decision threshold is at most 1.5% | metric_at_most(fpr_at_threshold, 0.015)
"""

# Omar claims v3 is ready. Its feature set drops the amount, so the holdout PR-AUC falls from
# about 0.39 to about 0.08 and the gate fails, while every test passes. The threshold targets a
# 1% false positive rate on validation; AC2 allows for the holdout to differ a little.
[[attempts]]
name = "v1"
commit = "test(fraud): add evaluation gate tests for fraud model v3"
claim = "ready"
steps = [
  { add_test = "scenarios/S17/test_fraud_gate.py.tmpl", dest = "tests/test_{token}_fraud_gate.py" },
]
