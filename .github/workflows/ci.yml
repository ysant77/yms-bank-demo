name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the repro step checks out the base commit of the pull request.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra fraud
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Coverage is measured here, not in the benchmark run, so tracing does not slow the
      # measured code (definition of done, D-cov).
      - run: uv run pytest -q --cov=src --cov-branch --cov-report=json:coverage.json
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: |
          uv export --locked --extra fraud --no-hashes --no-emit-project --format requirements-txt -q > requirements-audit.txt
          if ! uv run --locked pip-audit -r requirements-audit.txt --no-deps --disable-pip \
               --format json -o audit.json; then
            echo "AUDIT_FAILED=1" >> "$GITHUB_ENV"
          fi
      - name: Test run with CI report (benchmarks included)
        if: ${{ !cancelled() }}
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_AUDIT_JSON: audit.json
          # The base run in scripts/repro.py uses the same value, so a test cannot tell the two
          # runs apart by it.
          PYTHONPATH: src
        run: uv run pytest -q -m "bench or not bench" --ci-report=ci-report.json
      # Definition of done, D-repro: the pull request's test files run on the base commit, and
      # the report gets a repro block (base and head outcome of each test). Code decides nothing
      # here; the verifier reads the block.
      - name: Run the pull request's tests on the base commit
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/repro.py --base "$BASE_SHA" --head "$HEAD_SHA" --head-report ci-report.json
      # D-cov: the main report (main.json on the ci-reports branch) holds the base total. It is
      # the report of the latest push to main, not of the pull request's base commit. It is
      # fetched in its own step, so no step that runs pull request code sees the token.
      - name: Fetch the main report
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/contents/main.json?ref=ci-reports" --jq .content 2>/dev/null \
            | base64 -d > main.json || rm -f main.json
      # D-cov: coverage of the changed lines of src/. The diff ends at the checked-out commit (for
      # a pull request, the merge commit), the commit that the coverage run measured.
      - name: Coverage of the changed lines
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--coverage coverage.json --head-report ci-report.json)
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA" --base-report main.json); fi
          uv run python scripts/changed_coverage.py "${args[@]}"
      # Imports added by the pull request, compared with the standard library, this repository
      # and uv.lock. The block lists them; the verifier decides.
      - name: Imports added by the pull request
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--head-report ci-report.json)
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA" --head "$HEAD_SHA"); fi
          uv run python scripts/import_guard.py "${args[@]}"
      - name: Upload CI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report
          path: ci-report.json
          if-no-files-found: error
      - name: Fail on known vulnerabilities
        if: ${{ env.AUDIT_FAILED == '1' }}
        run: |
          echo "The dependency audit found known vulnerabilities (see audit step)."
          exit 1

  # Posts the report on the pull request. Runs no repository code.
  report:
    if: ${{ github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-report
      - name: Hash the CI report
        id: hash
        # Report hash rule, shared with the app's verifier (reportHash in src/verifier/report.js):
        # sha256 of the UTF-8 text with trailing spaces, tabs, CR and LF removed.
        run: |
          echo "sha256=$(python3 -c 'import hashlib,sys; t=open(sys.argv[1],encoding="utf-8",newline="").read().rstrip(" \t\r\n"); print(hashlib.sha256(t.encode("utf-8")).hexdigest())' ci-report.json)" >> "$GITHUB_OUTPUT"
      # The marker binds this report to this run: only the run can upload to itself. The app
      # compares the marker with the hash of the report it reads.
      - name: Upload the report hash marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-sha256-${{ steps.hash.outputs.sha256 }}-attempt-${{ github.run_attempt }}
          path: ci-report.json
          if-no-files-found: error
      - name: Comment the CI report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo '<!-- aat-ci-report -->'
            echo '```json'
            cat ci-report.json
            echo
            echo '```'
          } > comment.md
          # Keep one report comment per pull request: edit the bot's earlier one if it exists.
          # --jq runs once per page, so print every match and keep the last one.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- aat-ci-report -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          fi

  # Publishes the default branch report to the ci-reports branch as main.json.
  publish-main-report:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-report
      - name: Hash the CI report
        id: hash
        # Report hash rule, shared with the app's verifier (reportHash in src/verifier/report.js):
        # sha256 of the UTF-8 text with trailing spaces, tabs, CR and LF removed.
        run: |
          echo "sha256=$(python3 -c 'import hashlib,sys; t=open(sys.argv[1],encoding="utf-8",newline="").read().rstrip(" \t\r\n"); print(hashlib.sha256(t.encode("utf-8")).hexdigest())' ci-report.json)" >> "$GITHUB_OUTPUT"
      # The marker binds this report to this run: only the run can upload to itself. The app
      # compares the marker with the hash of the report it reads.
      - name: Upload the report hash marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-report-sha256-${{ steps.hash.outputs.sha256 }}-attempt-${{ github.run_attempt }}
          path: ci-report.json
          if-no-files-found: error
      - name: Write main.json on the ci-reports branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/branches/ci-reports" > /dev/null 2>&1; then
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/ci-reports -f sha="$GITHUB_SHA" > /dev/null
          fi
          sha=$(gh api "repos/$REPO/contents/main.json?ref=ci-reports" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/$REPO/contents/main.json" -f branch=ci-reports
                -f message="ci: report for main at $GITHUB_SHA" -f content="$(base64 -w0 ci-report.json)")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" > /dev/null

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One check to require in the ruleset. It runs on every event, also when a job before it failed
  # or was skipped, and fails unless each job that this event must run succeeded. A job skipped by
  # its own "if" (for example "if: false") is then a failure, not a pass.
  # Limit: this job is in the same file, so a pull request that edits this file can also change or
  # skip the gate; GitHub reports a skipped required check as passed. The app does not trust CI
  # evidence from a pull request that changes .github/workflows/ (docs/claims.md in agile-team).
  gate:
    if: ${{ always() }}
    needs: [test, report, publish-main-report, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          TEST: ${{ needs.test.result }}
          SECRETS: ${{ needs.secrets.result }}
          REPORT: ${{ needs.report.result }}
          PUBLISH: ${{ needs.publish-main-report.result }}
          WANT_REPORT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          WANT_PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          fail=0
          need() { echo "$1: $2"; if [ "$2" != success ]; then echo "::error::$1 must succeed, result is $2"; fail=1; fi; }
          need test "$TEST"
          need secrets "$SECRETS"
          if [ "$WANT_REPORT" = true ]; then need report "$REPORT"; else echo "report: $REPORT (not run for this event)"; fi
          if [ "$WANT_PUBLISH" = true ]; then need publish-main-report "$PUBLISH"; else echo "publish-main-report: $PUBLISH (not run for this event)"; fi
          exit "$fail"
